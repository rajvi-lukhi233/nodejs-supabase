<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Chat</title>
  </head>
  <body>
    <h2>Realtime Chat</h2>
    <input type="text" id="sender" placeholder="Sender ID" />
    <input type="text" id="receiver" placeholder="Receiver ID" />
    <button onclick="connectRealtime()">Connect Realtime</button>
    <br /><br />

    <input type="text" id="message" placeholder="Enter message" />
    <button onclick="sendMessage()">Send</button>

    <ul id="messages"></ul>
    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
      const supabase = createClient(
        "https://nuqtyhwvuznipqjnqgjx.supabase.co",
        "sb_publishable_nlh9vP-HThim_158vN2OCg_Bpy0neZb",
      );
      window.connectRealtime = () => {
        const receiver = document.getElementById("receiver").value;

        supabase
          .channel("chat-room")
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter: `receiverId=eq.${receiver}`,
            },
            (payload) => {
              console.log(payload);
              const li = document.createElement("li");
              li.innerText = payload.new.message;
              document.getElementById("messages").appendChild(li);
            },
          )
          .subscribe((status) => {
            console.log(status);
          });
      };
      window.sendMessage = async () => {
        const sender = document.getElementById("sender").value;
        const receiver = document.getElementById("receiver").value;
        const message = document.getElementById("message").value;

        await fetch("/api/message/sendMessage", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            senderId: sender,
            receiverId: receiver,
            message,
          }),
        });
      };
    </script>
  </body>
</html>
